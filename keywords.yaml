# Job title must contain at least one of these
title_include:
  - devops
  - sre
  - site reliability
  - platform engineer
  - infrastructure engineer
  - release engineer
  - build engineer

# Skip titles containing any of these words (you have 2+ years)
title_exclude:
  - senior
  - sr
  - lead
  - principal
  - staff
  - manager
  - head
  - director
  - architect
  - intern

# Skills from your resume, matched as whole words in title + description
skills:
  - aws
  - eks
  - kubernetes
  - terraform
  - jenkins
  - docker
  - ansible
  - prometheus
  - grafana
  - python
  - ci/cd
  - sonarqube
  - linux
  - azure
  - loki
  - tempo

min_skill_hits: 2          # job must mention at least this many skills

# Location rules
onsite_cities: [bengaluru, bangalore]
remote_regions: [india, anywhere, worldwide, apac, asia]
allow_unspecified_remote: false   # true = also accept jobs that only say Remote

min_years_required: 1
max_years_required: 3      # skip jobs asking for more years than this

# AI scoring (free Gemini key). Set to false to use keyword filtering only.
use_ai_scoring: true
min_score: 45               # only alert when the AI score is at least this
max_alerts_per_run: 35
